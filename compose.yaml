services:
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z-distroless
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"   # S3 API (9000 is taken by ClickHouse in the other project)
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - silo-data:/data

  silo-init:
    image: docker.io/pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      - silo
    environment:
      MC_HOST_local: http://admin:password@silo:9000
    command: ["mb", "--ignore-existing", "local/warehouse"]
    restart: on-failure

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    user: root
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://silo:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/data/catalog.db
    volumes:
      - iceberg-catalog:/data
    depends_on:
      - silo

  marquez-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U marquez" ]
      interval: 5s
      retries: 10

  marquez:
    image: marquezproject/marquez:0.51.1
    ports:
      - "5002:5000"   # API
      - "5003:5001"   # admin / health
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      SEARCH_ENABLED: "false"
    depends_on:
      marquez-db:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    ports:
      - "3001:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    depends_on:
      - marquez

  trino:
    image: trinodb/trino:484
    ports:
      - "8090:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - iceberg-rest

volumes:
  silo-data:
  iceberg-catalog:
  marquez-db: