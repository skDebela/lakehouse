services:
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z-distroless
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"   # S3 API (9000 is taken by ClickHouse in the other project)
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - silo-data:/data

  silo-init:
    image: docker.io/pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      - silo
    environment:
      MC_HOST_local: http://admin:password@silo:9000
    command: ["mb", "--ignore-existing", "local/warehouse"]
    restart: on-failure

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    user: root
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://silo:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/data/catalog.db
    volumes:
      - iceberg-catalog:/data
    depends_on:
      - silo

volumes:
  silo-data:
  iceberg-catalog: